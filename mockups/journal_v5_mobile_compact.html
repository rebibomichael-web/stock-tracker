<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Dashboard — Mobile Compact</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#111418; color:#e8eaf0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .col { max-width:560px; margin:0 auto; padding:0 12px 32px; }

  /* ── Sticky top bar ─────────────────────────────── */
  .topbar {
    position:sticky; top:0; z-index:50;
    background:rgba(17,20,24,.96);
    backdrop-filter: blur(6px);
    border-bottom:1px solid #262c36;
  }
  .topbar-inner { max-width:560px; margin:0 auto; padding:10px 12px 8px; }
  .titlerow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .titlerow h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  .badge {
    font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:#f3c96b; border:1px solid #5a4a22; background:#241d0e;
    padding:2px 7px; border-radius:999px; white-space:nowrap;
  }
  .datechips { display:flex; gap:8px; margin-top:8px; }
  .chip {
    flex:1 1 0; min-height:46px; border-radius:11px;
    border:1px solid #2a303c; background:#1b1f27; color:#c6cdd9;
    font:inherit; cursor:pointer; padding:5px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    -webkit-tap-highlight-color:transparent;
  }
  .chip .wk { font-size:10px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:#8b93a3; }
  .chip .md { font-size:14px; font-weight:700; }
  .chip[aria-pressed="true"] { background:#2b3546; border-color:#4a6ea8; color:#eef3fb; }
  .chip[aria-pressed="true"] .wk { color:#9db8dd; }
  .ctxline { margin-top:7px; font-size:10.5px; line-height:1.45; color:#9aa3b2; }
  .ctxline .sess { color:#d7dce6; font-weight:600; }

  /* ── Index strip ────────────────────────────────── */
  .idxwrap { overflow-x:auto; margin:10px -12px 0; padding:0 12px 6px; scrollbar-width:thin; }
  .idxstrip { display:flex; gap:8px; width:max-content; }
  .idx {
    background:#1b1f27; border:1px solid #262c36; border-radius:10px;
    padding:6px 10px; min-width:96px;
  }
  .idx .nm { font-size:9.5px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:#8b93a3; white-space:nowrap; }
  .idx .vl { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .idx .ch { font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .up   { color:#5fd38d; }
  .down { color:#ff8280; }
  .flat { color:#9aa3b2; }

  /* ── Sections (details/summary) ─────────────────── */
  details.sec { margin-top:12px; background:#1b1f27; border:1px solid #262c36; border-radius:12px; }
  details.sec > summary {
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:8px;
    min-height:48px; padding:10px 14px;
    font-size:15px; font-weight:700;
    -webkit-tap-highlight-color:transparent;
  }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary::after {
    content:""; margin-left:auto; width:8px; height:8px; flex:none;
    border-right:2px solid #7d8595; border-bottom:2px solid #7d8595;
    transform:rotate(45deg); transition:transform .15s ease;
  }
  details.sec[open] > summary::after { transform:rotate(-135deg); }
  .secbody { padding:2px 12px 14px; border-top:1px solid #232935; }

  /* ── ACT NOW cards ──────────────────────────────── */
  .an-card { background:#20242e; border:1px solid #3d3030; border-left:3px solid #e0705a; border-radius:10px; padding:12px 12px 11px; margin-top:10px; }
  .an-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .an-tk { font-size:19px; font-weight:800; letter-spacing:.3px; }
  .an-score { font-size:11px; font-weight:800; color:#ffb199; background:#3a231d; border:1px solid #5c352a; border-radius:999px; padding:2px 8px; font-variant-numeric:tabular-nums; }
  .an-px { margin-left:auto; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .an-px .rsi { font-size:11px; font-weight:600; color:#9aa3b2; margin-left:6px; }
  .an-meta { margin-top:3px; font-size:10.5px; color:#8b93a3; }
  .an-meta b { color:#c6cdd9; font-weight:600; }
  .an-rows { margin-top:9px; display:flex; flex-direction:column; gap:5px; }
  .an-row {
    display:flex; align-items:baseline; gap:8px;
    background:#191d25; border-radius:8px; padding:8px 10px; min-height:40px;
  }
  .an-row .lbl { flex:0 0 76px; font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#8b93a3; }
  .an-row .big { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .an-row .sub { margin-left:auto; font-size:11px; color:#9aa3b2; font-variant-numeric:tabular-nums; text-align:right; }
  .an-row.stop .big, .an-row.stop .sub { color:#ff8280; }
  .an-row.stop .lbl { color:#c96e6c; }
  .an-row.tgt .big { color:#5fd38d; }
  .an-note { margin-top:9px; font-size:12px; line-height:1.5; color:#b9c1cf; }
  .an-note b { color:#eef1f7; }

  /* ── Heatmap ────────────────────────────────────── */
  .hm-grouplabel { margin:12px 2px 6px; font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#8b93a3; }
  .hm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile {
    border-radius:9px; padding:8px 8px 7px; min-height:56px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center; gap:1px;
    border:1px solid rgba(255,255,255,.06);
    -webkit-tap-highlight-color:transparent;
  }
  .tile .trow { display:flex; align-items:center; gap:4px; }
  .tile .tk { font-size:13px; font-weight:800; letter-spacing:.3px; color:#fff; }
  .tile .lp {
    margin-left:auto; font-size:9px; font-weight:800; font-variant-numeric:tabular-nums;
    color:#ffffff; background:rgba(0,0,0,.34); border:1px solid rgba(255,255,255,.25);
    border-radius:999px; padding:1px 5px; white-space:nowrap;
  }
  .tile .ch { font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; color:rgba(255,255,255,.92); }
  .tile.excl { opacity:.62; border-style:dashed; border-color:rgba(255,255,255,.18); }
  .tile .rsn { font-size:10px; line-height:1.25; color:rgba(255,255,255,.75); }
  .hm-detail {
    margin-top:10px; font-size:11.5px; color:#b9c1cf; background:#171b22;
    border:1px dashed #2c3340; border-radius:8px; padding:8px 10px;
    font-variant-numeric:tabular-nums;
  }
  .hm-detail b { color:#eef1f7; }

  /* ── Tables (LEAPs + over-75) ───────────────────── */
  .tblwrap { overflow-x:auto; margin-top:8px; border:1px solid #232935; border-radius:9px; }
  table { border-collapse:collapse; width:100%; min-width:560px; font-size:12px; }
  th, td { text-align:right; padding:7px 9px; white-space:nowrap; border-bottom:1px solid #232935; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  th { font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:#8b93a3; background:#171b22; position:sticky; top:0; }
  th:first-child, td:first-child {
    text-align:left; position:sticky; left:0; z-index:2;
    font-weight:800; background:#1b1f27;
    border-right:1px solid #2a303c;
  }
  th:first-child { background:#171b22; z-index:3; }
  td { color:#d7dce6; background:#1b1f27; }
  .muted { color:#8b93a3; }
  .small { font-size:10px; }
  tr.tint-act td { background:#2a2027; }
  tr.tint-act td:first-child { background:#2e222a; }
  tr.tint-buy td { background:#1e2620; }
  tr.tint-buy td:first-child { background:#212a24; }

  .sig { display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.4px; border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .sig-s3     { color:#ffd7d5; background:#4a1f1e; border:1px solid #7c3230; }
  .sig-s2     { color:#ffe1ad; background:#403010; border:1px solid #6d5320; }
  .sig-strong { color:#c9f4d9; background:#173425; border:1px solid #2b5c3f; }
  .sig-mon    { color:#aab2c0; background:#242a34; border:1px solid #333c4a; }
  .sig-act    { color:#ffd9c9; background:#48231a; border:1px solid #8a4630; }
  .sig-buy    { color:#c9f4d9; background:#173425; border:1px solid #2b5c3f; }
  .sig-watch  { color:#aab2c0; background:#242a34; border:1px solid #333c4a; }

  .leap-sub { margin:12px 2px 0; font-size:12.5px; font-weight:700; color:#d7dce6; }
  .leap-sub .thr { font-size:10.5px; font-weight:600; color:#8b93a3; }

  /* ── Positions ──────────────────────────────────── */
  .pos-card { background:#191d25; border:1px solid #262c36; border-radius:10px; padding:10px 11px; margin-top:9px; }
  .pos-head { display:flex; align-items:center; gap:8px; }
  .pos-tk { font-size:15px; font-weight:800; letter-spacing:.3px; }
  .pos-chip { margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.4px; border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .pc-good { color:#c9f4d9; background:#173425; border:1px solid #2b5c3f; }
  .pc-bad  { color:#ffd7d5; background:#4a1f1e; border:1px solid #7c3230; }
  .pc-warn { color:#ffe1ad; background:#403010; border:1px solid #6d5320; }
  .pos-line { margin-top:5px; font-size:12px; color:#c6cdd9; font-variant-numeric:tabular-nums; }
  .pos-line .arr { color:#6b7482; }
  .pos-mom { margin-top:6px; display:flex; align-items:center; gap:7px; font-size:11px; color:#9aa3b2; font-variant-numeric:tabular-nums; }
  .mom-meter { display:flex; gap:3px; }
  .mom-seg { width:16px; height:6px; border-radius:2px; background:#2a303c; }
  .mom-seg.on-hi  { background:#3fbf77; }
  .mom-seg.on-mid { background:#e3b341; }
  .mom-seg.on-lo  { background:#e06c62; }
  .pos-checks { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .chk { background:#151920; border:1px solid #232935; border-radius:7px; padding:5px 7px; }
  .chk .k { font-size:10.5px; font-weight:700; }
  .chk .k .ic { font-weight:800; margin-right:3px; }
  .chk.ok .ic { color:#5fd38d; }
  .chk.no .ic { color:#ff8280; }
  .chk .v { font-size:10px; color:#8b93a3; line-height:1.3; }

  footer { max-width:560px; margin:20px auto 0; padding:0 12px 26px; font-size:10.5px; color:#6b7482; text-align:center; }
</style>
</head>

<div class="col">

  <details class="sec" id="sec-over">

    <div class="secbody" id="body-over"></div>
  </details>

</div>

<footer>Mockup Variation 5 — Mobile Compact · static sample data · integrates over swing_flags.html</footer>

const DEFAULT_DATE = "2026-07-03";

// ─── Rendering ─────────────────────────────────────────────────────────────
let selectedDate = DEFAULT_DATE;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function fmtPrice(p) {
  if (p < 1) return "$" + p.toFixed(4);
  if (p >= 1000) return "$" + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return "$" + p.toFixed(2);
}
function fmtChg(c) { return (c > 0 ? "+" : "") + c.toFixed(2) + "%"; }
function fmtPct1(c) { return (c > 0 ? "+" : "") + c.toFixed(1) + "%"; }
function fmtUsd(v) { return (v < 0 ? "-$" : "+$") + Math.abs(v).toFixed(2); }
function chgClass(c) { return Math.abs(c) < 0.15 ? "flat" : (c > 0 ? "up" : "down"); }

// Diverging tile ramp: neutral gray at ~0, ramps to green/red, capped at ±5%.
// Excluded tiles get the same ramp pulled 55% back toward gray (desaturated).
function tileColor(chg, excluded) {
  const NEUT = [58, 64, 74];                       // #3a404a neutral gray midpoint
  if (Math.abs(chg) < 0.15) return `rgb(${NEUT.join(",")})`;
  const END = chg > 0 ? [18, 122, 65] : [186, 55, 55];
  let t = 0.18 + 0.82 * Math.min(Math.abs(chg), 5) / 5;
  if (excluded) t *= 0.45;
  const c = NEUT.map((n, i) => Math.round(n + (END[i] - n) * t));
  return `rgb(${c.join(",")})`;
}

function sigClass(s) {
  switch (s) {
    case "S3 ALERT": return "sig-s3";
    case "S2 ALERT": return "sig-s2";
    case "STRONG SETUP": return "sig-strong";
    case "MONITOR": return "sig-mon";
    case "ACT NOW": return "sig-act";
    case "BUY": return "sig-buy";
    default: return "sig-watch";
  }
}

// ── Top bar: date chips + session/context line + index strip ──
function buildChips() {
  const dates = Object.keys(JOURNALS).sort();
  $("#datechips").innerHTML = dates.map((dt) => {
    const parts = JOURNALS[dt].label.split(", ");       // ["Thu", "Jul 3 2026"]
    const md = parts[1].replace(/ \d{4}$/, "");
    return `<button class="chip" type="button" data-date="${dt}" aria-pressed="${dt === selectedDate}">
      <span class="wk">${parts[0]}</span><span class="md">${md}</span></button>`;
  }).join("");
  $("#datechips").querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => { selectedDate = b.dataset.date; render(); }));
}

function renderTop(d) {
  $("#datechips").querySelectorAll(".chip").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.date === selectedDate)));
  $("#ctxline").innerHTML =
    `<span class="sess">${esc(d.label)} · ${esc(d.session)}</span><br>${esc(d.market.context)}`;
  $("#idxstrip").innerHTML = d.market.indexes.map((ix) => `
    <div class="idx">
      <div class="nm">${esc(ix.name)}</div>
      <div class="vl">${esc(ix.value)}</div>
      <div class="ch ${chgClass(ix.chg)}">${fmtChg(ix.chg)}${ix.note ? ` <span class="muted">${esc(ix.note)}</span>` : ""}</div>
    </div>`).join("");
}

// ── ACT NOW ──
function renderActNow(d) {
  const list = d.swing.actNow;
  $("#sum-act").textContent = `🔥 Act Now (${list.length})`;
  $("#body-act").innerHTML = list.map((a) => `
    <div class="an-card">
      <div class="an-head">
        <span class="an-tk">${esc(a.t)}</span>
        <span class="an-score">${a.score}/100</span>
        <span class="an-px">${fmtPrice(a.price)}<span class="rsi">RSI ${a.rsi}</span></span>
      </div>
      <div class="an-meta">As of <b>${esc(a.asOf)}</b> · Hold <b>${esc(a.hold)}</b> · Hard stop <b>${esc(a.hardStop)}</b></div>
      <div class="an-rows">
        <div class="an-row entry"><span class="lbl">Entry</span><span class="big">${fmtPrice(a.entry)}</span><span class="sub">max chase ${fmtPrice(a.maxChase)}</span></div>
        <div class="an-row stop"><span class="lbl">Stop</span><span class="big">${fmtPrice(a.stop)}</span><span class="sub">${fmtPct1(a.stopPct)} · ${fmtUsd(a.stopPerShare)}/sh</span></div>
        <div class="an-row tgt"><span class="lbl">Target 1</span><span class="big">${fmtPrice(a.t1)}</span><span class="sub">${fmtPct1(a.t1Pct)} · R/R ${esc(a.rr1)}</span></div>
        <div class="an-row tgt"><span class="lbl">Target 2</span><span class="big">${fmtPrice(a.t2)}</span><span class="sub">${fmtPct1(a.t2Pct)} · R/R ${esc(a.rr2)}</span></div>
      </div>
      <div class="an-note"><b>${esc(a.theme)}</b> — ${esc(a.note)}</div>
    </div>`).join("");
}

// ── Heatmap ──
function tileHTML(s) {
  const bg = tileColor(s.chg, s.group === "excluded");
  const badge = s.leap != null ? `<span class="lp">${s.leap}/15</span>` : "";
  const tip = `${s.t} — ${fmtPrice(s.price)} · ${fmtChg(s.chg)}` +
    (s.leap != null ? ` · LEAP ${s.leap}/15` : "") + (s.reason ? ` · ${s.reason}` : "");
  return `<div class="tile ${s.group === "excluded" ? "excl" : ""}" style="background:${bg}"
      title="${esc(tip)}" data-tip="${esc(tip)}">
    <div class="trow"><span class="tk">${esc(s.t)}</span>${badge}</div>
    <div class="ch">${fmtChg(s.chg)}</div>
    ${s.reason ? `<div class="rsn">${esc(s.reason)}</div>` : ""}
  </div>`;
}

function renderHeat(d) {
  const hm = d.heatmap;
  const act = hm.filter((s) => s.group === "active");
  const exc = hm.filter((s) => s.group === "excluded");
  const cry = hm.filter((s) => s.group === "crypto");
  $("#sum-heat").textContent = `🗺 Heatmap (${hm.length})`;
  $("#body-heat").innerHTML = `
    <div class="hm-grouplabel">Active (${act.length})</div>
    <div class="hm-grid">${act.map(tileHTML).join("")}</div>
    <div class="hm-grouplabel">Excluded from scan (${exc.length})</div>
    <div class="hm-grid">${exc.map(tileHTML).join("")}</div>
    <div class="hm-grouplabel">Crypto (${cry.length})</div>
    <div class="hm-grid">${cry.map(tileHTML).join("")}</div>
    <div class="hm-detail" id="hm-detail">Tap a tile for price · % change · LEAP score · reason</div>`;
  $("#body-heat").querySelectorAll(".tile").forEach((el) =>
    el.addEventListener("click", () => {
      const t = el.dataset.tip.split(" — ");
      $("#hm-detail").innerHTML = `<b>${esc(t[0])}</b> — ${esc(t.slice(1).join(" — "))}`;
    }));
}

// ── LEAPs ──
function leapTable(rows) {
  return `<div class="tblwrap"><table>
    <thead><tr><th>Ticker</th><th>Price</th><th>% Chg</th><th>Premium</th><th>Strike / Exp</th><th>Score</th><th>Signal</th><th>Rev</th></tr></thead>
    <tbody>${rows.map((r) => `
      <tr>
        <td>${esc(r.t)}</td>
        <td>${fmtPrice(r.price)}</td>
        <td class="${chgClass(r.chg)}">${fmtChg(r.chg)}</td>
        <td>$${r.premium.toFixed(2)}</td>
        <td class="small muted">$${r.strike} · ${esc(r.exp)} (${r.dte}d)</td>
        <td><b>${r.score}/15</b></td>
        <td style="text-align:left"><span class="sig ${sigClass(r.signal)}">${esc(r.signal)}</span></td>
        <td class="small" style="text-align:left">${esc(r.rev)}</td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

function renderLeaps(d) {
  const L = d.leaps;
  $("#sum-leaps").textContent =
    `🎯 LEAPs (${L.original.length}+${L.exceeders.length} · beat ${L.origTopScore}/15)`;
  $("#body-leaps").innerHTML = `
    <div class="leap-sub">Top 3 LEAPs — Original Scan</div>
    ${leapTable(L.original)}
    <div class="leap-sub">Full-Scan LEAPs beating today's top score <span class="thr">(&gt; ${L.origTopScore}/15)</span></div>
    ${leapTable(L.exceeders)}`;
}

// ── Positions ──
function renderPositions(d) {
  const list = d.swing.positions;
  $("#sum-pos").textContent = `📟 Positions (${list.length} flagged)`;
  const chipIcon = { good: "✓", bad: "⚠", warn: "⏸" };
  const segCls = (p) => (p.momentum >= 2 ? "on-hi" : p.momentum === 1 ? "on-mid" : "on-lo");
  $("#body-pos").innerHTML = list.map((p) => `
    <div class="pos-card">
      <div class="pos-head">
        <span class="pos-tk">${esc(p.t)}</span>
        <span class="pos-chip pc-${p.statusKind}">${chipIcon[p.statusKind]} ${esc(p.status)}</span>
      </div>
      <div class="pos-line">${fmtPrice(p.entry)} <span class="arr">→</span> <b>${fmtPrice(p.cur)}</b>
        <b class="${chgClass(p.pct)}">${fmtPct1(p.pct)}</b> <span class="muted">· ${p.days}d held</span></div>
      <div class="pos-mom">Momentum <b>${p.momentum}/4</b>
        <span class="mom-meter">${[0,1,2,3].map((i) =>
          `<span class="mom-seg ${i < p.momentum ? segCls(p) : ""}"></span>`).join("")}</span>
        <span>${esc(p.momPerBar)}</span></div>
      <div class="pos-checks">${p.checks.map((c) => `
        <div class="chk ${c.ok ? "ok" : "no"}">
          <div class="k"><span class="ic">${c.ok ? "✓" : "✗"}</span>${esc(c.k)}</div>
          <div class="v">${esc(c.v)}</div>
        </div>`).join("")}</div>
    </div>`).join("");
}

// ── Over-75 table ──
function renderOver75(d) {
  const rows = d.swing.over75;
  $("#sum-over").textContent = `🚩 Flags > 75 (${rows.length})`;
  $("#body-over").innerHTML = `
    <div class="leap-sub" style="margin-top:10px">All Flags — Final Score &gt; 75</div>
    <div class="tblwrap"><table>
      <thead><tr><th>Symbol</th><th>Price</th><th>RSI</th><th>Tech</th><th>BT±</th><th>Final</th><th>Swing%</th><th>ARB</th><th>Signal</th><th>Opinion</th></tr></thead>
      <tbody>${rows.map((r) => {
        const tint = r.signal === "ACT NOW" ? "tint-act" : r.signal === "BUY" ? "tint-buy" : "";
        return `<tr class="${tint}">
          <td>${esc(r.t)}</td>
          <td>${fmtPrice(r.price)}</td>
          <td>${r.rsi.toFixed(1)}</td>
          <td>${r.tech}</td>
          <td>${esc(r.bt)}</td>
          <td><b>${r.final}</b></td>
          <td>${fmtPct1(r.swingPct)}</td>
          <td>${r.arb.toFixed(1)}</td>
          <td style="text-align:left"><span class="sig ${sigClass(r.signal)}">${esc(r.signal)}</span></td>
          <td class="small" style="text-align:left">${esc(r.opinion)}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;
}

function render() {
  const d = JOURNALS[selectedDate];
  renderTop(d);
  renderActNow(d);
  renderHeat(d);
  renderLeaps(d);
  renderPositions(d);
  renderOver75(d);
}

buildChips();
render();
</script>
</body>
</html>
