<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Dashboard — Command Center</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }
  @media (max-width: 500px) { .wrap { padding: 14px 12px 32px; } }

  .card {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
  }
  .muted { color: #94a3b8; }
  .pos { color: #34d399; }
  .neg { color: #f87171; }
  .flat { color: #94a3b8; }

  /* ── Top bar ─────────────────────────────────── */
  .topbar { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 24px; margin-bottom: 14px; }
  .titleblock h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mockbadge {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #94a3b8; border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    padding: 2px 9px; white-space: nowrap;
  }
  .sessionline { color: #94a3b8; font-size: 12.5px; margin-top: 3px; }
  .sessionline b { color: #e2e8f0; font-weight: 600; }

  .chipstrip { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
  @media (max-width: 900px) { .chipstrip { margin-left: 0; width: 100%; } }
  .chip {
    flex: 0 0 auto; min-width: 56px; text-align: center; cursor: pointer;
    background: #1e293b; border: 1px solid rgba(255,255,255,.10); border-radius: 9px;
    padding: 6px 10px 7px; color: #e2e8f0; font: inherit; position: relative;
  }
  .chip .dow { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .1em; color: #94a3b8; text-transform: uppercase; }
  .chip .dnum { display: block; font-size: 15px; font-weight: 700; margin-top: 1px; }
  .chip:not(.off):not(.sel):hover { border-color: rgba(255,255,255,.28); }
  .chip.sel { background: #f1f5f9; border-color: #f1f5f9; }
  .chip.sel .dow { color: #475569; }
  .chip.sel .dnum { color: #0f172a; }
  .chip.off { opacity: .38; cursor: not-allowed; }

  /* CSS tooltip */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 7px); transform: translateX(-50%);
    background: #0b1120; color: #e2e8f0; font-size: 11.5px; font-weight: 500;
    border: 1px solid rgba(255,255,255,.14); border-radius: 7px;
    padding: 6px 9px; white-space: pre; z-index: 50; pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); line-height: 1.5;
  }

  /* ── Market strip ────────────────────────────── */
  .market { padding: 12px 16px; margin-bottom: 14px; }
  .ctxline { font-size: 12.5px; color: #cbd5e1; margin-bottom: 10px; }
  .idxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
  .idx { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  .idx .nm { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; white-space: nowrap; }
  .idx .vl { font-size: 13.5px; font-weight: 650; margin-top: 1px; white-space: nowrap; }
  .idx .ch { font-size: 11.5px; font-weight: 600; white-space: nowrap; }

  /* ── KPI row ─────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { padding: 14px 16px 13px; }
  .kpi .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: #94a3b8; }
  .kpi .big { font-size: 42px; font-weight: 700; line-height: 1.05; margin-top: 4px; letter-spacing: -.02em; }
  .kpi .big small { font-size: 19px; font-weight: 600; color: #94a3b8; letter-spacing: 0; }
  .kpi .sub { font-size: 11.5px; color: #94a3b8; margin-top: 3px; }
  .kpi.hot .big { color: #f59e0b; }

  /* ── Section headers ─────────────────────────── */
  .sechead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 10px; }
  .sechead h2 { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .sechead .note { font-size: 12px; color: #94a3b8; }
  .cnt { font-size: 11px; font-weight: 700; background: rgba(255,255,255,.08); border-radius: 999px; padding: 1px 8px; color: #e2e8f0; }

  /* ── ACT NOW hero ────────────────────────────── */
  .actgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .actcard {
    background: linear-gradient(180deg, rgba(245,158,11,.09), rgba(245,158,11,.03)), #1e293b;
    border: 1px solid rgba(245,158,11,.55); border-radius: 10px; padding: 16px 18px 14px;
    box-shadow: 0 0 0 3px rgba(245,158,11,.07);
  }
  .actcard .toprow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .actcard .tk { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .scorechip { font-size: 12px; font-weight: 700; color: #0f172a; background: #f59e0b; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .actcard .px { font-size: 17px; font-weight: 650; }
  .actcard .meta { font-size: 11.5px; color: #94a3b8; margin-left: auto; text-align: right; }
  .actcard .theme { margin: 9px 0 11px; font-size: 12.5px; color: #cbd5e1; }
  .actcard .theme b { color: #fbbf24; font-weight: 700; }
  .fieldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px 12px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 11px; }
  .fld .fl { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; }
  .fld .fv { font-size: 13.5px; font-weight: 650; margin-top: 1px; }
  .fld .fv small { font-size: 11px; font-weight: 500; color: #94a3b8; }
  .fld.stop .fv, .fld.stop .fv small { color: #f87171; }
  .fld.tgt .fv { color: #34d399; }
  .fld.tgt .fv small { color: #6ee7b7; }

  /* ── 2-column band ───────────────────────────── */
  .band { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-bottom: 22px; }
  @media (max-width: 900px) { .band { grid-template-columns: minmax(0, 1fr); } }
  .bandcard { padding: 16px 18px; }
  .bandcard h2 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .bandcard .sub { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }

  /* Heatmap */
  .grouplbl { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #94a3b8; margin: 14px 0 7px; }
  .grouplbl:first-of-type { margin-top: 2px; }
  .heatgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 7px; }
  .heatgrid.mini { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .tile { border-radius: 8px; padding: 8px 10px 7px; min-height: 58px; position: relative; cursor: default; border: 1px solid rgba(255,255,255,.06); }
  .tile .tk { font-size: 13px; font-weight: 750; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .tile .pc { font-size: 12px; font-weight: 650; margin-top: 2px; }
  .tile .rs { font-size: 9.5px; font-weight: 600; margin-top: 3px; color: rgba(255,255,255,.75); letter-spacing: .02em; }
  .leapbadge { font-size: 9px; font-weight: 700; background: rgba(15,23,42,.5); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px; padding: 1px 5px; white-space: nowrap; }
  .tile.exc {
    background-image: repeating-linear-gradient(45deg, rgba(148,163,184,.13) 0 5px, transparent 5px 11px);
  }
  .tile.mini { min-height: 48px; padding: 6px 9px; }
  .heatlegend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.07); font-size: 10.5px; color: #94a3b8; }
  .heatlegend .bar { flex: 1 1 120px; min-width: 100px; max-width: 220px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #a52121, #703043 30%, #2b3548 50%, #1f4d53 70%, #066c4c); border: 1px solid rgba(255,255,255,.08); }
  .heatlegend .cap { white-space: nowrap; }

  /* LEAPs card */
  .leaprow { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.07); min-width: 0; }
  .leaprow:first-of-type { border-top: none; }
  .leaprow .medal { font-size: 17px; flex: 0 0 22px; text-align: center; }
  .leaprow .main { min-width: 0; flex: 1 1 auto; }
  .leaprow .l1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .leaprow .tk { font-size: 14px; font-weight: 750; }
  .leaprow .px { font-size: 12px; font-weight: 600; color: #e2e8f0; }
  .leaprow .pc { font-size: 12px; font-weight: 650; }
  .leaprow .l2 { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .leaprow .l2 b { color: #cbd5e1; font-weight: 600; }
  .leaprow .right { text-align: right; flex: 0 0 auto; }
  .lscore { font-size: 13px; font-weight: 750; }
  .lscore small { font-size: 10px; color: #94a3b8; font-weight: 600; }
  .sig { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; border-radius: 999px; padding: 1.5px 8px; white-space: nowrap; margin-top: 3px; }
  .sig.s3   { color: #fca5a5; background: rgba(248,113,113,.14); border: 1px solid rgba(248,113,113,.4); }
  .sig.s2   { color: #fcd34d; background: rgba(245,158,11,.14);  border: 1px solid rgba(245,158,11,.4); }
  .sig.st   { color: #6ee7b7; background: rgba(52,211,153,.12);  border: 1px solid rgba(52,211,153,.35); }
  .sig.mon  { color: #94a3b8; background: rgba(148,163,184,.10); border: 1px solid rgba(148,163,184,.3); }
  .sig.act  { color: #fbbf24; background: rgba(245,158,11,.16);  border: 1px solid rgba(245,158,11,.5); }
  .sig.buy  { color: #6ee7b7; background: rgba(52,211,153,.12);  border: 1px solid rgba(52,211,153,.35); }
  .leapdivide { margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .leapdivide .t { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #fbbf24; }
  .leapdivide .s { font-size: 11px; color: #94a3b8; margin-top: 1px; }

  /* ── Positions ───────────────────────────────── */
  .posgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .poscard { padding: 13px 15px 12px; }
  .poscard .hd { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .poscard .tk { font-size: 17px; font-weight: 800; }
  .statch { font-size: 10px; font-weight: 750; letter-spacing: .05em; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .statch.good { color: #6ee7b7; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); }
  .statch.bad  { color: #fca5a5; background: rgba(248,113,113,.14); border: 1px solid rgba(248,113,113,.45); }
  .statch.warn { color: #fcd34d; background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.45); }
  .poscard .days { margin-left: auto; font-size: 11px; color: #94a3b8; white-space: nowrap; }
  .poscard .pxline { font-size: 12.5px; margin-top: 7px; color: #cbd5e1; display: flex; gap: 7px; flex-wrap: wrap; align-items: baseline; }
  .poscard .pxline b { font-weight: 700; color: #f1f5f9; }
  .momline { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .momline .ml { font-size: 11px; font-weight: 650; color: #cbd5e1; white-space: nowrap; }
  .meter { display: flex; gap: 2px; }
  .meter i { display: block; width: 17px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.13); }
  .momline .mb { font-size: 11px; color: #94a3b8; white-space: nowrap; }
  .checks { margin-top: 9px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 8px; display: grid; gap: 4px; }
  .checks .ck { display: flex; gap: 7px; font-size: 11.5px; align-items: baseline; }
  .checks .ic { font-weight: 800; flex: 0 0 12px; }
  .checks .kk { color: #94a3b8; flex: 0 0 68px; }
  .checks .vv { color: #e2e8f0; min-width: 0; }

  /* ── Over-75 table ───────────────────────────── */
  .tablecard { padding: 16px 18px 8px; margin-bottom: 22px; }
  .tscroll { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th { text-align: right; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.1); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th.l, td.l { text-align: left; }
  td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.05); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.sym { font-weight: 750; font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  tr.rowact { background: rgba(245,158,11,.08); box-shadow: inset 3px 0 0 #f59e0b; }
  tr.rowbuy { background: rgba(52,211,153,.05); box-shadow: inset 3px 0 0 rgba(52,211,153,.55); }

  footer { text-align: center; color: #64748b; font-size: 11.5px; padding-top: 6px; }
</style>
</head>

  const chgCls = n => Math.abs(n) < 0.15 ? "flat" : (n > 0 ? "pos" : "neg");
  const fmtPx = p => p >= 1000 ? p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                   : p < 1 ? p.toFixed(4) : p.toFixed(2);

  // Diverging heat ramp: neutral slate at 0 → emerald / red, capped at ±5%.
  function heatColor(chg) {
    if (Math.abs(chg) < 0.15) return { bg: "#2b3548", fg: "#e2e8f0", pc: "#cbd5e1" };
    const m = Math.min(Math.abs(chg), 5) / 5;
    const w = 0.28 + 0.72 * m;
    const base = [43, 53, 72];
    const target = chg > 0 ? [6, 108, 76] : [165, 33, 33];
    const c = base.map((b, i) => Math.round(b + (target[i] - b) * w));
    return { bg: "rgb(" + c.join(",") + ")", fg: "#ffffff", pc: chg > 0 ? "#d1fae5" : "#fee2e2" };
  }

  const SIGCLS = { "S3 ALERT": "s3", "S2 ALERT": "s2", "STRONG SETUP": "st", "MONITOR": "mon", "ACT NOW": "act", "BUY": "buy", "WATCH": "mon" };
  const sigChip = s => '<span class="sig ' + (SIGCLS[s] || "mon") + '">' + esc(s) + '</span>';
  const STATICON = { good: "▲", bad: "⚠", warn: "⏸" };

  // ── renderers ─────────────────────────────────
  function renderChips() {
    document.getElementById("chipstrip").innerHTML = DATE_STRIP.map(d => {
      if (!d.key) {
        return '<span class="chip off" data-tip="no journal"><span class="dow">' + d.dow + '</span><span class="dnum">' + d.dnum + '</span></span>';
      }
      const sel = d.key === selectedDate ? " sel" : "";
      return '<button type="button" class="chip' + sel + '" data-date="' + d.key + '"><span class="dow">' + d.dow + '</span><span class="dnum">' + d.dnum + '</span></button>';
    }).join("");
    document.querySelectorAll(".chip[data-date]").forEach(el => {
      el.addEventListener("click", () => { selectedDate = el.getAttribute("data-date"); render(); });
    });
    // keep the most recent (journal) chips in view when the strip overflows
    const strip = document.getElementById("chipstrip");
    strip.scrollLeft = strip.scrollWidth;
  }

  function renderSession(J) {
    document.getElementById("sessionline").innerHTML = '<b>' + esc(J.label) + '</b> · ' + esc(J.session);
  }

  function renderMarket(J) {
    const idx = J.market.indexes.map(i =>
      '<div class="idx"><div class="nm">' + esc(i.name) + '</div>' +
      '<div class="vl">' + esc(i.value) + '</div>' +
      '<div class="ch ' + chgCls(i.chg) + '">' + sgn(i.chg) + (i.note ? ' <span class="muted">' + esc(i.note) + '</span>' : '') + '</div></div>'
    ).join("");
    document.getElementById("marketcard").innerHTML =
      '<div class="ctxline">' + esc(J.market.context) + '</div><div class="idxgrid">' + idx + '</div>';
  }

  function renderKpis(J) {
    const vix = J.market.indexes.find(i => i.name === "VIX");
    const allLeaps = J.leaps.original.concat(J.leaps.exceeders);
    const top = allLeaps.reduce((a, b) => b.score > a.score ? b : a, allLeaps[0]);
    document.getElementById("kpis").innerHTML =
      '<div class="card kpi hot"><div class="lbl">🔥 Act now</div><div class="big">' + J.swing.actNow.length + '</div><div class="sub">swing setups · Final ≥ 85</div></div>' +
      '<div class="card kpi"><div class="lbl">Flagged positions</div><div class="big">' + J.swing.positions.length + '</div><div class="sub">open position alerts</div></div>' +
      '<div class="card kpi"><div class="lbl">Top LEAP score</div><div class="big">' + top.score + '<small>/15</small></div><div class="sub">' + esc(top.t) + ' · best of the day</div></div>' +
      '<div class="card kpi"><div class="lbl">VIX · mood</div><div class="big">' + esc(vix.value) + '</div><div class="sub">' + esc(vix.note || "") + ' · ' + sgn(vix.chg) + ' today</div></div>';
  }

  function renderActNow(J) {
    const n = J.swing.actNow.length;
    document.getElementById("acthead").innerHTML =
      '<h2>🔥 ACT NOW</h2><span class="cnt">' + n + '</span><span class="note">every symbol with Final score ≥ 85 — most actionable first</span>';
    document.getElementById("actgrid").innerHTML = J.swing.actNow.map(a =>
      '<div class="actcard">' +
        '<div class="toprow"><span class="tk">' + esc(a.t) + '</span>' +
          '<span class="scorechip">' + a.score + '/100</span>' +
          '<span class="px">$' + fmtPx(a.price) + '</span>' +
          '<span class="meta">RSI ' + a.rsi.toFixed(1) + '<br>As of ' + esc(a.asOf) + '</span></div>' +
        '<div class="theme"><b>' + esc(a.theme) + '</b> — ' + esc(a.note) + '</div>' +
        '<div class="fieldgrid">' +
          '<div class="fld"><div class="fl">Entry</div><div class="fv">$' + fmtPx(a.entry) + '</div></div>' +
          '<div class="fld"><div class="fl">Max chase</div><div class="fv">$' + fmtPx(a.maxChase) + '</div></div>' +
          '<div class="fld stop"><div class="fl">Stop</div><div class="fv">$' + fmtPx(a.stop) + ' <small>' + a.stopPct.toFixed(1) + '% · ' + a.stopPerShare.toFixed(2) + '&nbsp;$/sh</small></div></div>' +
          '<div class="fld tgt"><div class="fl">Target 1</div><div class="fv">$' + fmtPx(a.t1) + ' <small>+' + a.t1Pct.toFixed(1) + '% · R/R ' + esc(a.rr1) + '</small></div></div>' +
          '<div class="fld tgt"><div class="fl">Target 2</div><div class="fv">$' + fmtPx(a.t2) + ' <small>+' + a.t2Pct.toFixed(1) + '% · R/R ' + esc(a.rr2) + '</small></div></div>' +
          '<div class="fld"><div class="fl">Hold</div><div class="fv">' + esc(a.hold) + '</div></div>' +
          '<div class="fld"><div class="fl">Hard stop</div><div class="fv">' + esc(a.hardStop) + '</div></div>' +
        '</div>' +
      '</div>'
    ).join("");
  }

  function tileHtml(s, mini) {
    const c = heatColor(s.chg);
    const exc = s.group === "excluded";
    const bg = exc ? "#252e40" : c.bg;
    const fg = exc ? "#94a3b8" : c.fg;
    const pcCol = exc ? "#94a3b8" : c.pc;
    let tip = esc(s.t) + "  $" + fmtPx(s.price) + "\n" + sgn(s.chg) + " today";
    if (s.leap !== null) tip += "\nLEAP score " + s.leap + "/15";
    if (s.reason) tip += "\nExcluded: " + esc(s.reason);
    return '<div class="tile' + (exc ? " exc" : "") + (mini ? " mini" : "") + '" style="background-color:' + bg + ';color:' + fg + '" data-tip="' + tip + '">' +
      '<div class="tk">' + esc(s.t) + (s.leap !== null ? '<span class="leapbadge">' + s.leap + '/15</span>' : '') + '</div>' +
      '<div class="pc" style="color:' + pcCol + '">' + sgn(s.chg) + '</div>' +
      (s.reason ? '<div class="rs" style="color:#94a3b8">✕ ' + esc(s.reason) + '</div>' : '') +
    '</div>';
  }

  function renderHeatmap(J) {
    const act = J.heatmap.filter(s => s.group === "active");
    const exc = J.heatmap.filter(s => s.group === "excluded");
    const cry = J.heatmap.filter(s => s.group === "crypto");
    document.getElementById("heatcard").innerHTML =
      '<h2>Journal heatmap</h2><div class="sub">' + J.heatmap.length + ' tickers in the journal · tile color = % change today (gray ≈ flat, capped ±5%)</div>' +
      '<div class="grouplbl">Active — ' + act.length + '</div><div class="heatgrid">' + act.map(s => tileHtml(s, false)).join("") + '</div>' +
      '<div class="grouplbl">Excluded from scan — ' + exc.length + '</div><div class="heatgrid">' + exc.map(s => tileHtml(s, false)).join("") + '</div>' +
      '<div class="grouplbl">Crypto — ' + cry.length + '</div><div class="heatgrid mini">' + cry.map(s => tileHtml(s, true)).join("") + '</div>' +
      '<div class="heatlegend"><span class="cap">−5%</span><span class="bar"></span><span class="cap">+5%</span><span class="cap" style="margin-left:8px">gray ≈ flat (|chg| &lt; 0.15%) · hover a tile for detail</span></div>';
  }

  function leapRow(l, rankIcon) {
    return '<div class="leaprow">' +
      '<div class="medal">' + rankIcon + '</div>' +
      '<div class="main">' +
        '<div class="l1"><span class="tk">' + esc(l.t) + '</span><span class="px">$' + fmtPx(l.price) + '</span><span class="pc ' + chgCls(l.chg) + '">' + sgn(l.chg) + '</span></div>' +
        '<div class="l2">Premium <b>$' + l.premium.toFixed(2) + '</b> · $' + l.strike + ' strike · ' + esc(l.exp) + ' (' + l.dte + 'd) · Rev: ' + esc(l.rev) + '</div>' +
      '</div>' +
      '<div class="right"><div class="lscore">' + l.score + '<small>/15</small></div>' + sigChip(l.signal) + '</div>' +
    '</div>';
  }

  function renderLeaps(J) {
    const medals = ["🥇", "🥈", "🥉"];
    const ex = J.leaps.exceeders;
    document.getElementById("leapcard").innerHTML =
      '<h2>LEAPs</h2><div class="sub">Top 3 — original scan (journal watchlist)</div>' +
      J.leaps.original.map((l, i) => leapRow(l, medals[i])).join("") +
      '<div class="leapdivide"><div class="t">⚡ Full scan — beat the day\'s best</div>' +
      '<div class="s">' + ex.length + ' LEAP' + (ex.length === 1 ? "" : "s") + ' scoring &gt; ' + J.leaps.origTopScore + '/15 (original top score)</div></div>' +
      ex.map(l => leapRow(l, "⚡")).join("");
  }

  function renderPositions(J) {
    const P = J.swing.positions;
    document.getElementById("poshead").innerHTML =
      '<h2>Open position alerts</h2><span class="cnt">' + P.length + '</span><span class="note">' + P.length + ' position' + (P.length === 1 ? "" : "s") + ' flagged</span>';
    document.getElementById("posgrid").innerHTML = P.map(p => {
      const sev = p.momentum >= 3 ? "#34d399" : p.momentum >= 2 ? "#f59e0b" : "#f87171";
      let segs = "";
      for (let i = 0; i < 4; i++) segs += '<i style="' + (i < p.momentum ? "background:" + sev : "") + '"></i>';
      const checks = p.checks.map(c =>
        '<div class="ck"><span class="ic ' + (c.ok ? "pos" : "neg") + '">' + (c.ok ? "✓" : "✗") + '</span>' +
        '<span class="kk">' + esc(c.k) + '</span><span class="vv">' + esc(c.v) + '</span></div>').join("");
      return '<div class="card poscard">' +
        '<div class="hd"><span class="tk">' + esc(p.t) + '</span>' +
          '<span class="statch ' + p.statusKind + '">' + STATICON[p.statusKind] + ' ' + esc(p.status) + '</span>' +
          '<span class="days">' + p.days + 'd held</span></div>' +
        '<div class="pxline"><span class="muted">Entry</span> <b>$' + fmtPx(p.entry) + '</b> <span class="muted">→</span> <b>$' + fmtPx(p.cur) + '</b>' +
          '<span class="' + chgCls(p.pct) + '" style="font-weight:700">' + sgn1(p.pct) + '</span></div>' +
        '<div class="momline"><span class="ml">Momentum ' + p.momentum + '/4</span><span class="meter">' + segs + '</span><span class="mb">' + esc(p.momPerBar) + '</span></div>' +
        '<div class="checks">' + checks + '</div>' +
      '</div>';
    }).join("");
  }

  function renderOver75(J) {
    const rows = J.swing.over75.map(r => {
      const cls = r.signal === "ACT NOW" ? "rowact" : r.signal === "BUY" ? "rowbuy" : "";
      return '<tr class="' + cls + '">' +
        '<td class="sym">' + esc(r.t) + '</td>' +
        '<td>$' + fmtPx(r.price) + '</td>' +
        '<td>' + r.rsi.toFixed(1) + '</td>' +
        '<td>' + r.tech + '</td>' +
        '<td>' + esc(r.bt) + '</td>' +
        '<td style="font-weight:750">' + r.final + '</td>' +
        '<td class="' + chgCls(r.swingPct) + '">' + sgn1(r.swingPct) + '</td>' +
        '<td class="' + chgCls(r.arb) + '">' + (r.arb > 0 ? "+" : "") + r.arb.toFixed(1) + '</td>' +
        '<td class="l">' + sigChip(r.signal) + '</td>' +
        '<td class="l" style="font-variant-numeric:normal">' + esc(r.opinion) + '</td>' +
      '</tr>';
    }).join("");
    document.getElementById("over75card").innerHTML =
      '<h2 style="font-size:14px;font-weight:700">All flags — Final score &gt; 75</h2>' +
      '<div class="sub" style="font-size:12px;color:#94a3b8;margin-bottom:8px">' + J.swing.over75.length + ' symbols from today\'s swing scan</div>' +
      '<div class="tscroll"><table><thead><tr>' +
      '<th>Symbol</th><th>Price</th><th>RSI</th><th>Tech</th><th>BT±</th><th>Final</th><th>Swing%</th><th>ARB</th><th class="l">Signal</th><th class="l">Opinion</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function render() {
    const J = JOURNALS[selectedDate];
    renderChips();
    renderSession(J);
    renderMarket(J);
    renderKpis(J);
    renderActNow(J);
    renderHeatmap(J);
    renderLeaps(J);
    renderPositions(J);
    renderOver75(J);
  }

  render();
})();
</script>
</body>
</html>
